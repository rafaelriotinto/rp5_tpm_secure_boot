# dm-verity root filesystem, set up by the kernel itself from the command line
# (dm-mod.create=..., CONFIG_DM_INIT) -- no initramfs. Everything must be
# BUILT IN: the root device has to exist before any module could be loaded.
CONFIG_BLK_DEV_DM=y
CONFIG_DM_INIT=y
CONFIG_DM_VERITY=y
CONFIG_CRYPTO_SHA256=y
