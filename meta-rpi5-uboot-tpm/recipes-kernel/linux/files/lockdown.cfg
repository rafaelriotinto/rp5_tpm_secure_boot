# Keep the superuser out of the kernel and out of physical memory, so that no program on
# the running system can read the OTP memory (which holds the firmware key) or the memory
# the firmware uses, other than through the firmware interface that U-Boot has locked.
#
# Kernel lockdown, confidentiality mode, from early boot and not revocable at run time:
# blocks /dev/mem, /dev/kmem, /dev/port, kprobes, BPF reads of kernel memory, debugfs,
# hibernation, and unsigned modules.
CONFIG_SECURITY=y
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y
CONFIG_LOCK_DOWN_KERNEL_FORCE_CONFIDENTIALITY=y
CONFIG_LSM="lockdown"
# Only modules built (and signed at build time) with this image can be loaded.
CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_FORCE=y
CONFIG_MODULE_SIG_ALL=y
CONFIG_MODULE_SIG_SHA256=y
# No physical-memory devices at all (belt and braces).
# CONFIG_DEVMEM is not set
# CONFIG_DEVPORT is not set
# The TPM transport must not depend on loadable modules under MODULE_SIG_FORCE.
# On the Pi 5 the 40-pin SPI0 that the TPM sits on is a DesignWare controller in
# the RP1; build only that driver in. SPI_GPIO must NOT be built in: the U-Boot
# soft-SPI overlay leaves a spi-gpio node on the same pins, and a built-in
# spi-gpio claims them first, making the hardware SPI0 fail to register (-EBUSY).
CONFIG_SPI_DESIGNWARE=y
CONFIG_SPI_DW_MMIO=y
