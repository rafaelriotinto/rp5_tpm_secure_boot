#TPM Support
CONFIG_TPM=y
CONFIG_TPM_V2=y
CONFIG_TPM2_TIS_SPI=y
CONFIG_TCG2=y
CONFIG_MEASURED_BOOT=y
CONFIG_CMD_TPM=y
CONFIG_CMD_TPM_V2=y
CONFIG_EFI_TCG2_PROTOCOL=n

#Device Model
CONFIG_DM=y
CONFIG_CMD_DM=y
CONFIG_DM_VERBOSE=y

#Device Tree
CONFIG_OF_BOARD=y
CONFIG_OF_SEPARATE=y

#PCI Support (for RP1 southbridge)
CONFIG_PCI=y
CONFIG_DM_PCI=y
CONFIG_PCI_INIT_R=y
CONFIG_PCI_BRCMSTB=y

#SPI Support
CONFIG_SPI=y
CONFIG_DM_SPI=y
CONFIG_SPI_MEM=y
CONFIG_SOFT_SPI=y
CONFIG_CMD_SPI=y

#GPIO Support (for soft-SPI bit-banging)
CONFIG_DM_GPIO=y
CONFIG_RP1_GPIO=y
#Measured boot: sanitize boot-varying DT fields before PCR0 measurement
CONFIG_MEASURE_DEVICETREE_SANITIZE=y

#Convenience: hash command for DTB stability checks on the console
CONFIG_CMD_HASH=y

#Phase A: read files from inside boot.img (FAT image mapped from RAM)
CONFIG_BLKMAP=y
CONFIG_CMD_BLKMAP=y

#Secure boot: self-contained boot path baked into the (signed) U-Boot binary.
#Load boot.img from the boot partition into RAM, map it as a block device,
#load the kernel Image from INSIDE it, and boot with the firmware DT (measured
#boot then measures exactly what runs). Falls back to the normal bootflow scan
#if the boot.img path fails, so an unsigned/dev card still boots.
CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="if printenv rpi_bootpart && fatload mmc 0:${rpi_bootpart} 0x20000000 boot.img; then setexpr biblk ${filesize} + 0x1ff; setexpr biblk ${biblk} / 0x200; if blkmap create bi && blkmap map bi 0 ${biblk} mem 0x20000000 && blkmap get bi dev bidev; then if fatload blkmap ${bidev} ${kernel_addr_r} Image; then fdt addr ${fdt_addr}; booti ${kernel_addr_r} - ${fdt_addr}; fi; fi; fi; echo BOOTIMG path failed - falling back to bootflow scan; bootflow scan; echo BOOT FAILED - resetting; reset"

#Hardening: never wait and never accept a keypress -- there is no interactive
#U-Boot console on a provisioned device. BOOTDELAY=-2 boots immediately and
#cannot be interrupted. bootcmd (above) ends in "reset" so that a failed boot
#can never fall through to the prompt either: at the prompt, "fdt print /chosen"
#would reveal the DUID before Linux even starts.
CONFIG_BOOTDELAY=-2
CONFIG_AUTOBOOT=y

# The DUID no longer protects anything (the anchor is the firmware key), so it is left in the
# devicetree handed to Linux instead of being removed (reverts the r12 scrub).
# CONFIG_MEASURE_SCRUB_DUID is not set

#Secure boot: no persistent environment - an unsigned uboot.env on the FAT
#partition could override the signed built-in bootcmd (verified on hardware:
#saved env carried old bootcmd AND old board identity across boards).
CONFIG_ENV_IS_NOWHERE=y
CONFIG_ENV_IS_IN_FAT=n

#Measured boot: also record measurements in the TPM NV extend index
CONFIG_MEASURE_NV_EXTEND=y
CONFIG_MEASURE_NV_INDEX=0x00800000
# Board anchor: the NV extend and the anti-rollback increment are authorised by
# TPM2_PolicySigned with the SoC firmware's OTP key (rpi-fw-crypto); the key is
# locked before the kernel starts. Requires bootloader firmware >= 2026-06-17 and
# indices provisioned with the PolicySigned policies (provisioning/fwcrypto).
CONFIG_MEASURE_NV_AUTH_FWKEY=y
# Anti-rollback: refuse releases older than the highest committed one (TPM NV
# counter 0x01800002, incremented only on committed, non-tryboot boots).
# CONFIG_ANTIROLLBACK_VERSION is THE release security version: bump on every
# release, never reuse. Release ab-r12 = 12 (LOCKDOWN: no debug-tweaks, root locked, gettys masked).
CONFIG_ANTIROLLBACK=y
CONFIG_ANTIROLLBACK_VERSION=15
CONFIG_ANTIROLLBACK_NV_INDEX=0x00800002
