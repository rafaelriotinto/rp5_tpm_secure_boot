#TPM Support
CONFIG_TPM=y
CONFIG_TPM_V2=y
CONFIG_TPM2_TIS_SPI=y
CONFIG_TCG2=y
CONFIG_MEASURED_BOOT=y
CONFIG_CMD_TPM=y
CONFIG_CMD_TPM_V2=y
CONFIG_EFI_TCG2_PROTOCOL=n

#Device Model
CONFIG_DM=y
CONFIG_CMD_DM=y
CONFIG_DM_VERBOSE=y

#Device Tree
CONFIG_OF_BOARD=y
CONFIG_OF_SEPARATE=y

#PCI Support (for RP1 southbridge)
CONFIG_PCI=y
CONFIG_DM_PCI=y
CONFIG_PCI_INIT_R=y
CONFIG_PCI_BRCMSTB=y

#SPI Support
CONFIG_SPI=y
CONFIG_DM_SPI=y
CONFIG_SPI_MEM=y
CONFIG_SOFT_SPI=y
CONFIG_CMD_SPI=y

#GPIO Support (for soft-SPI bit-banging)
CONFIG_DM_GPIO=y
CONFIG_RP1_GPIO=y