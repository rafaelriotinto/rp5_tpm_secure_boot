# The root filesystem is read-only (dm-verity). Dropbear's host keys must live
# on the writable, no-exec data partition so that they persist across boots
# (a fresh key every boot would break every client's known_hosts).
[Unit]
RequiresMountsFor=/data
# Only generate a key when there is none on /data (the stock unit's own
# condition looks under /etc, which is read-only and never has one).
ConditionPathExists=!/data/dropbear/dropbear_rsa_host_key

[Service]
Environment="DROPBEAR_RSAKEY_DIR=/data/dropbear"
# Must come AFTER the stock unit's EnvironmentFile=-/etc/default/dropbear.
EnvironmentFile=/etc/dropbear-data.env
